services:
  mysql:
    image: mysql:8.4
    container_name: tif-planner-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: tif_planner
      MYSQL_USER: tif
      MYSQL_PASSWORD: secret
    volumes:
      - tif_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tif_mysql_data:
